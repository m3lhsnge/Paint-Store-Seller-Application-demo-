services:
  db:
    image: postgres:16-alpine
    container_name: paint_demo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paint_db
    ports:
      - "5432:5432"
    volumes:
      - paint_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paint_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paint_db_data:
