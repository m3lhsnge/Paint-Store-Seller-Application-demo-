<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Boya App</title>
  <meta name="description" content="Demo Boya App — Boya reçete hesaplama ve yönetim sistemi">
  <link rel="stylesheet" href="css/style.css">
  <style>
    textarea.form-control { resize: vertical; min-height: 60px; }
  </style>
</head>
<body>
  <div class="app-shell" id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark">DB</div>
        <div class="sidebar-logo-text">
          Demo Boya App
          <small id="sidebar-branch">—</small>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <div class="sidebar-section-label">Menü</div>

        <button class="nav-item" data-route="#dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Anasayfa
        </button>

        <button class="nav-item" data-route="#recipes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>
          Boyalar
        </button>

        <button class="nav-item" data-route="#materials">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
          Malzemeler
        </button>

        <button class="nav-item" data-route="#customers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Müşteriler
        </button>

        <div id="nav-reports-wrap">
          <button class="nav-item" data-route="#reports">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
            Raporlar
          </button>
        </div>
        
        <!-- Şube Geçişi (Admin/Yetkili) -->
        <div id="branch-switcher-wrap" style="display:none;padding:.5rem .5rem .25rem">
          <div style="font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:.25rem .75rem .2rem">Aktif Şube</div>
          <select id="branch-switcher" style="width:100%;background:#1e293b;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:.5rem .75rem;font-size:.85rem;font-weight:600;cursor:pointer;outline:none">
          </select>
        </div>
      </nav>

      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-username">—</div>
          <div class="sidebar-user-role" id="sidebar-role">—</div>
        </div>
        <button class="sidebar-logout" id="btn-logout" title="Çıkış Yap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title">Yükleniyor...</div>
        <div class="topbar-actions">
          <span class="badge badge-primary" id="topbar-branch"></span>
        </div>
      </header>

      <main class="page" id="page-content">
        <div class="loading-center"><span class="spinner"></span></div>
      </main>
    </div>

  </div>

  <!-- Renk Detay Modal (tüm sayfalardan showColor ile açılır) -->
  <div class="modal-overlay" id="modal-color">
    <div class="modal" style="max-width:340px">
      <div class="modal-header">
        <span class="modal-title" id="color-modal-title">Renk Detayı</span>
        <button class="modal-close" onclick="closeModal('modal-color')">&#10005;</button>
      </div>
      <div class="modal-body" style="text-align:center">
        <div id="color-preview-big" style="width:100%;height:140px;border-radius:var(--radius-sm);margin-bottom:1rem;border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;letter-spacing:1px"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
          <div style="background:var(--bg);border-radius:var(--radius-sm);padding:.75rem">
            <div class="text-xs text-muted" style="margin-bottom:.25rem">HEX</div>
            <div id="color-hex-val" style="font-family:monospace;font-weight:700;font-size:1rem"></div>
          </div>
          <div style="background:var(--bg);border-radius:var(--radius-sm);padding:.75rem">
            <div class="text-xs text-muted" style="margin-bottom:.25rem">RGB</div>
            <div id="color-rgb-val" style="font-family:monospace;font-weight:700;font-size:.9rem"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-color')">Kapat</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/materials.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/recipes.js"></script>
  <script src="js/pages/recipe_new.js"></script>
  <script src="js/pages/reports.js"></script>

  <script>
    // ─── GUARD ──────────────────────────────────────────────────────────
    const _guardToken = auth.getToken();
    const _guardUser  = auth.getUser();
    if (!_guardToken || !_guardUser) {
      auth.clear();
      window.location.href = 'login.html';
      throw new Error('redirect');        // script çalışmayı burada durdur
    }

    // ─── INIT UI ────────────────────────────────────────────────────────
    (function initShell() {
      const user = auth.getUser();
      if (!user) return;   // guard zaten yakaladı, buraya düşmez

      // Kullanıcı bilgileri
      document.getElementById('sidebar-username').textContent = user.full_name || user.username;
      document.getElementById('sidebar-role').textContent     = roleLabel(user.role);
      document.getElementById('sidebar-avatar').textContent   = (user.full_name || user.username || '?')[0].toUpperCase();
      document.getElementById('sidebar-branch').textContent   = user.branch_name || '';
      document.getElementById('topbar-branch').textContent    = user.branch_name || '';

      // Şube geçişi (Admin/Yetkili)
      if (auth.hasRole('ADMIN', 'YETKILI')) {
        const wrap = document.getElementById('branch-switcher-wrap');
        const sel  = document.getElementById('branch-switcher');
        // Sabit şubeler (seed'deki gibi)
        const branches = ['\u015eube A', '\u015eube B'];
        sel.innerHTML = branches.map(b =>
          `<option value="${b}" ${b === user.branch_name ? 'selected' : ''} style="background:#1e293b;color:#fff;padding:4px">${b}</option>`
        ).join('');
        wrap.style.display = '';
        sel.addEventListener('change', async () => {
          const prevBranch = auth.getUser()?.branch_name;
          const newBranch = sel.value;
          try {
            // Veri şubesi ancak backend'den yeni JWT alınınca değişir
            const data = await api.switchBranch(newBranch);
            auth.save(data.access_token, { ...auth.getUser(), branch_name: data.branch_name });
            document.getElementById('sidebar-branch').textContent = data.branch_name;
            document.getElementById('topbar-branch').textContent  = data.branch_name;
            router.refresh();
            toast('Şube değiştirildi: ' + data.branch_name, 'success');
          } catch (e) {
            sel.value = prevBranch;
            toast(e.message || 'Şube değiştirilemedi', 'error');
          }
        });
      }

      // Raporlar menü gizleme (USER rolü)
      if (!auth.hasRole('ADMIN', 'YETKILI')) {
        document.getElementById('nav-reports-wrap').style.display = 'none';
      }

      // Nav tıklamaları
      document.querySelectorAll('.nav-item[data-route]').forEach(btn => {
        btn.addEventListener('click', () => { location.hash = btn.dataset.route; });
      });

      // Çıkış
      document.getElementById('btn-logout').addEventListener('click', () => {
        if (confirm('Çıkış yapmak istiyor musunuz?')) auth.logout();
      });

      // Router başlat
      router.init();
    })();
  </script>
</body>
</html>
